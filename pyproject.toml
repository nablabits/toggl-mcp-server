[project]
name = "toggl-mcp-server"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "python-dotenv>=1.2.2",
    "tzlocal>=5.3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-vcr>=1.0",
    "pytest-cov>=4.0",
]
dev = [
    "black>=24.0",
    "isort>=5.0",
    "pre-commit>=3.0",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99
